# Gate, build and publish the web editor to GitHub Pages.
#
# This is the workflow that runs on `main`; ci.yml runs the same gates on a
# pull request, where there is nothing to deploy. The desktop artifacts are
# *not* built here — a signed, notarized dmg needs a macOS runner and Apple
# credentials (ELECTRON-PLAN §9). What runs here is the bundle-only smoke
# check, so a change that breaks the main or preload process fails on `main`
# rather than at the next release.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        name: Install
        env:
          # The Electron binary is 100 MB and is only needed to *run* the app.
          # Neither build below launches it.
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - run: npx eslint . --no-cache && npx oxlint .
        name: Lint

      - run: npm run test:unit -- --run
        name: Test

      # Smoke check for the desktop build: main, preload and renderer all
      # bundle. Nothing downstream uses out/ — the deploy ships dist/web.
      - run: npx electron-vite build
        name: Build (Electron)

      # `npm run build` is the *Electron* build. Pages wants the standalone
      # renderer, which is a separate config and a separate output directory.
      - run: npm run build:web
        name: Build (web)
        env:
          # GitHub Pages serves project sites from /<repo>/
          VITE_BASE: /${{ github.event.repository.name }}/

      # SPA fallback: GitHub Pages serves 404.html for unknown paths (e.g. /edit/:id)
      - run: cp dist/web/index.html dist/web/404.html
        name: SPA fallback

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
